# dsh-plugin-updater bundle patch.
#
# 1) Retire the stock inventory tab (row ui-settings-plugin-inventory from the
#    dsh-web-app layer) — this plugin replaces the single "插件列表" tab with
#    the built-in / third-party split below.
# 2) Insert this package's own dual-face row: the host half serves the
#    /api/dsh-plugin-updater/catalog route, the browser half registers the
#    "内置插件列表" and "第三方插件列表" tabs under 设置 > 插件.
#
# Applied after every earlier bundle layer (see dsh.profile.bundles order), so
# the disable below targets the row inserted by @deepseek-ai/dsh-web-app.
# Uninstalling this plugin restores the original tab automatically.
- id: ui-settings-plugin-inventory
  disabled: true
- insert:
    - id: plugin-updater
      name: 'dsh-plugin-updater'
